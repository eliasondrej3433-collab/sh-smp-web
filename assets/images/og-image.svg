<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.4)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none"/>
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16,185,129,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow circles -->
  <circle cx="200" cy="315" r="300" fill="url(#glowGrad)" opacity="0.3"/>
  <circle cx="1000" cy="315" r="250" fill="url(#glowGrad)" opacity="0.15"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Card background -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="rgba(15,15,25,0.85)" stroke="rgba(16,185,129,0.2)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Card glow border effect -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="none" stroke="rgba(16,185,129,0.08)" stroke-width="3"/>

  <!-- Sword icon box -->
  <rect x="140" y="140" width="100" height="100" rx="16" fill="url(#accentGrad)"/>
  <text x="190" y="208" font-family="Arial, sans-serif" font-size="52" text-anchor="middle" fill="white">⚔</text>

  <!-- ShadowBlade SMP text -->
  <text x="270" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">ShadowBlade SMP</text>

  <!-- Subtitle -->
  <text x="270" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a0a0b8" letter-spacing="3" text-transform="uppercase">MINECRAFT SURVIVAL SERVER</text>

  <!-- Separator line -->
  <rect x="140" y="250" width="340" height="2" rx="1" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Description -->
  <text x="140" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a0a0b8">
    <tspan x="140" dy="0">Moderní český Minecraft Survival server</tspan>
    <tspan x="140" dy="30">s aktivní komunitou a unikátním herním zážitkem.</tspan>
  </text>

  <!-- Features badges -->
  <rect x="140" y="350" width="220" height="36" rx="18" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="250" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="15" text-anchor="middle" fill="#34d399">⚔ Java &amp; Bedrock</text>

  <rect x="380" y="350" width="180" height="36" rx="18" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="470" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="15" text-anchor="middle" fill="#34d399">🎮 1.20–1.21</text>

  <!-- Right side decorative element - large Minecraft sword preview -->
  <g transform="translate(820, 160)" opacity="0.15">
    <rect x="0" y="0" width="240" height="240" rx="120" fill="rgba(16,185,129,0.05)"/>
  </g>

  <!-- Bottom info bar -->
  <rect x="80" y="450" width="1040" height="100" rx="0" fill="rgba(6,6,10,0.5)"/>
  <rect x="80" y="450" width="1040" height="100" rx="0" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Bottom rounded corners fix -->
  <rect x="80" y="470" width="1040" height="80" rx="0" fill="rgba(6,6,10,0.5)"/>

  <!-- IP address -->
  <text x="140" y="495" font-family="'Consolas', 'Courier New', monospace" font-size="20" fill="#34d399" font-weight="600">🌐 shadowbladesmp.org</text>

  <!-- Discord -->
  <text x="140" y="525" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#5865F2">💬 dsc.gg/shadowbladesmp</text>

  <!-- Bottom badge -->
  <rect x="840" y="470" width="220" height="40" rx="20" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="950" y="496" font-family="'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle" fill="#10b981">✨ Join Now!</text>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
